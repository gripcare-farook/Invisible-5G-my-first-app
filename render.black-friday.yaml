# Temporary owner-only campaign. Provision manually after credentials/credits are verified.
services:
  - type: cron
    name: laptop-watch-black-friday
    runtime: node
    plan: starter
    schedule: "*/5 0-4,14-23 26-28 11 *"
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @workspace/api-server build
    startCommand: node artifacts/api-server/dist/laptop-watch-job.mjs
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: LW_CAMPAIGN
        value: black-friday-2026
      - key: LW_LISTING_IDS
        sync: false
      - key: LW_OWNER_EMAIL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
# campaign.ts rejects every scrape outside the two exact UTC windows, including future years.
# Suspend/delete the service after the campaign to avoid further minimum monthly charges.
