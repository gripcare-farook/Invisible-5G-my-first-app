services:
  - type: web
    name: grille-calc
    runtime: node
    plan: free
    healthCheckPath: /api/healthz
    buildCommand: pnpm install --frozen-lockfile && BASE_PATH=/ pnpm --filter @workspace/grille-calc-web build && pnpm --filter @workspace/api-server build
    startCommand: pnpm --filter @workspace/api-server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
