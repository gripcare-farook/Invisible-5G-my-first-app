services:
  - type: web
    name: grille-calc
    runtime: node
    plan: free
    healthCheckPath: /api/healthz
    # Repeatable additive migrations run before the new server accepts requests.
    buildCommand: pnpm install --frozen-lockfile && BASE_PATH=/ pnpm --filter @workspace/grille-calc-web build && pnpm --filter @workspace/api-server build
    startCommand: node scripts/laptop-watch-db.mjs migrate && node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: APP_ORIGIN
        value: https://grille-calc.onrender.com
      - key: SESSION_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
