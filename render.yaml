services:
  - type: web
    name: grille-calc
    runtime: node
    plan: free
    healthCheckPath: /api/healthz
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/db push && BASE_PATH=/ pnpm --filter @workspace/grille-calc-web build && pnpm --filter @workspace/api-server build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
