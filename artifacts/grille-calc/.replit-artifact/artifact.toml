kind = "mobile"
previewPath = "/"
title = "5G Invisible Grille Smart Calculator"
version = "1.0.0"
id = "artifacts/grille-calc"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 23508

[services.development]
run = "pnpm --filter @workspace/grille-calc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/grille-calc", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/grille-calc", "run", "serve" ]

[services.env]
PORT = "23508"
BASE_PATH = "/"
